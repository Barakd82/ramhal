:root{--u:1vh;--w:1vw;--navy:#1b2a8a;--blue:#1f4c9e;--gold:#b08a4a;--cream:#fffbea;color-scheme:light}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:#10204a;font-family:"FRL","Frank Ruhl Libre","David","Times New Roman",serif;overflow:hidden;color:var(--navy);user-select:none;-webkit-user-select:none}
#admin input,#admin textarea{user-select:text;-webkit-user-select:text}
.screen{position:fixed;left:50%;top:50%;width:calc(100*var(--w));height:calc(100*var(--u));transform:translate(-50%,-50%);overflow:hidden;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.slide{position:absolute;inset:0;opacity:0;transition:opacity .8s;pointer-events:none;padding:calc(25*var(--u)) calc(2*var(--w)) calc(9.5*var(--u))}
.slide.on{opacity:1;pointer-events:auto}
.sky{background:repeating-conic-gradient(from -30deg at 50% -10%,#ffffff30 0 5deg,#ffffff00 5deg 10deg),linear-gradient(#9fcdf0,#e6f3fd 70%,#cfe6f8)}
.cream{background:radial-gradient(ellipse at 50% 50%,#fffdf2,#efe2b8)}
.cream::before,.cream::after,#hd::before,#hd::after{content:"";position:absolute;z-index:0;top:0;width:calc(11*var(--w));height:100%;background:repeating-linear-gradient(90deg,#1a3f9a 0 calc(1*var(--w)),#3a74d6 calc(1*var(--w)) calc(2*var(--w)),#15357f calc(2*var(--w)) calc(3.2*var(--w)));-webkit-mask-image:linear-gradient(#000 60%,#0000);mask-image:linear-gradient(#000 60%,#0000)}
.cream::before{right:0}.cream::after{left:0}
#hd{position:absolute;top:0;left:0;right:0;height:calc(23*var(--u));z-index:3;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:calc(1*var(--w));padding:calc(2*var(--u)) calc(2*var(--w)) 0;pointer-events:none}
#hd::before,#hd::after{height:calc(20*var(--u));width:calc(12*var(--w));opacity:.9;z-index:-1}
#hd::before{right:0;clip-path:polygon(0 0,100% 0,100% 100%,50% 70%,0 35%)}
#hd::after{left:0;clip-path:polygon(0 0,100% 0,100% 35%,50% 70%,0 100%)}
.plate{background:linear-gradient(#fffef6,#ecdcae);border-radius:calc(2.4*var(--u));box-shadow:inset 0 0 0 calc(.5*var(--u)) #d7dde6,inset 0 0 0 calc(.9*var(--u)) var(--gold),0 calc(.6*var(--u)) calc(1.4*var(--u)) #0005;text-align:center;font-weight:900;font-size:calc(12.5*var(--u));line-height:1;padding:calc(1.8*var(--u)) calc(.6*var(--w));color:var(--navy);white-space:nowrap}
#med{width:calc(34*var(--u));height:calc(21.5*var(--u));border-radius:50%;background:radial-gradient(circle at 50% 30%,#3e6fe0,#1536a6 70%,#0c2070);border:calc(1.1*var(--u)) solid #dfe6ee;box-shadow:0 0 0 calc(.6*var(--u)) #8d9bb0,0 0 0 calc(1.4*var(--u)) #eef2f7,0 calc(1*var(--u)) calc(2*var(--u)) #0007;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:calc(9.6*var(--u));font-variant-numeric:tabular-nums;text-shadow:0 calc(.5*var(--u)) calc(1*var(--u)) #0008;letter-spacing:.02em}
.pg{position:relative;z-index:2;height:100%;display:grid;grid-template-columns:calc(21*var(--w)) 1fr calc(21*var(--w));gap:calc(1.2*var(--w));align-items:center}
.side{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:calc(1*var(--u));height:100%}
.ribbon{width:100%;text-align:center;background:linear-gradient(#fffdf0,#ead9a8);font-size:calc(5.2*var(--u));font-weight:800;padding:calc(1.6*var(--u)) calc(1*var(--w));clip-path:polygon(0 0,100% 0,96% 50%,100% 100%,0 100%,4% 50%);box-shadow:inset 0 0 0 calc(.4*var(--u)) var(--gold);color:var(--navy)}
.side svg{height:calc(30*var(--u));width:auto}
.pan{position:relative;max-height:100%;overflow:hidden;background:linear-gradient(#fffef7,#f3e8c6);border:calc(1.3*var(--u)) solid var(--blue);outline:calc(.5*var(--u)) solid var(--gold);outline-offset:calc(-.2*var(--u));border-radius:calc(2*var(--u));box-shadow:inset 0 0 0 calc(.6*var(--u)) #fffef7,inset 0 0 0 calc(.9*var(--u)) var(--gold),0 calc(1*var(--u)) calc(2*var(--u)) #0004;padding:calc(3*var(--u)) calc(2.5*var(--w));display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:calc(1.2*var(--u))}
.sky .pan{background:linear-gradient(#fbfdff,#dcecf9)}
.mem{font-size:calc(5.2*var(--u));font-weight:800;line-height:1.35}
.prow{display:flex;justify-content:space-between;gap:calc(3*var(--w));width:100%;font-size:calc(4.6*var(--u));font-weight:700;padding:calc(.9*var(--u)) calc(1*var(--w));border-bottom:calc(.35*var(--u)) dotted var(--gold)}
.prow b{font-size:calc(5.4*var(--u));color:var(--blue);font-variant-numeric:tabular-nums}
.nc{font-size:calc(4.8*var(--u));font-weight:800}.nc small{display:block;font-size:calc(3*var(--u));font-weight:500;color:#44558a}
.nc b{display:block;font-size:calc(3.2*var(--u));color:var(--blue);font-weight:700}

  if(T["נפטרים"]){const R=T["נפטרים"],h=R[0].map(x=>x.trim());o.nif=R.slice(1).map(r=>{const g=n=>cv(r,h,n),fam=g("שם משפחה"),nm=(g("שם")+" "+(fam==="."?"":fam)).trim(),z=g("מין")==="זכר";if(!nm||!g("יום")||!g("חודש"))return"";const par=g("אבא")||g("אמא"),dt=[g("יום")+" ב"+g("חודש"),g("שנה")].filter(Boolean).join(" ");return nm+" "+(z?"ז״ל":"ע״ה")+(par?" / "+(z?"בן ":"בת ")+fx(par):"")+" | "+fx(dt)+(/^(כן|1|\*|קבוע|true)/i.test(g("קבוע"))?" | *":"")}).filter(Boolean).join("\n")}
  if(T["תורמים"]){const R=T["תורמים"],h=R[0].map(x=>x.trim());o.don=R.slice(1).map(r=>{const a=cv(r,h,"שם"),b=cv(r,h,"תרומה"),c=cv(r,h,"הקדשה");return a?a+(b||c?" | "+b:"")+(c?" | "+c:""):""}).filter(Boolean).join("\n")}
  if(T["הזכרות"])o.haz=two(T["הזכרות"],"שם","פרט");if(T["תפילות"])o.prayers=two(T["תפילות"],"שם","שעה");if(T["שבת"])o.shabbat=two(T["שבת"],"שם","שעה");
  if(T["לוח"])o.mem=T["לוח"].slice(1).map(r=>(r[0]||"").trim()).filter(Boolean).join("\n");
  return o}
const SS={t:0,err:""};let syncTimer;
function stat(){const e=$("sheetSt");if(!e)return;e.textContent=!SID(D.sheet)?"לא מחובר לגיליון":SS.err?"שגיאה: "+SS.err+(localStorage.getItem("syn_sheet")?" · מוצג העותק האחרון ששמור":" · (בדף המפורסם ב-Claude החיבור לגיליון חסום; יעבוד בקובץ שמאוחסן באתר)"):SS.t?"מסונכרן, עודכן ב-"+hhmm(SS.t):"ממתין לסנכרון…";e.style.color=SS.err?"#f2c94c":"#a9e4c0"}
async function syncSheet(){const id=SID(D.sheet);if(!id){stat();return}
  try{const T={};for(const n of Object.keys(NEED))try{T[n]=await getTab(id,n)}catch(x){if(n==="הגדרות"||n==="נפטרים")throw x}
    if(!T["הגדרות"]&&!T["נפטרים"])throw new Error("לא נמצאו לשוניות בשמות הנכונים");
    const o=mapSheet(T),js=JSON.stringify(o),old=localStorage.getItem("syn_sheet"),prev=old?JSON.stringify(JSON.parse(old).o||{}):"";
    try{localStorage.setItem("syn_sheet",JSON.stringify({t:Date.now(),o}))}catch(x){}
    SS.t=Date.now();SS.err="";if(js!==prev){Object.assign(D,o);build()}}
  catch(x){SS.err=String(x&&x.message||x)}stat()}
function startSync(){clearInterval(syncTimer);if(SID(D.sheet)){syncSheet();syncTimer=setInterval(syncSheet,Math.max(1,+D.smin||10)*6e4)}else stat()}
addEventListener("online",()=>SID(D.sheet)&&syncSheet());

async function pollDB(){try{const r=await fetch("database.json?_="+Date.now(),{cache:"no-store"});if(!r.ok)return;const t=await r.text();JSON.parse(t);DBOK=true;if(t===DBT)return;DBT=t;try{localStorage.setItem("syn_db",t)}catch(e){}Object.assign(D,JSON.parse(t));reSheet();build();auto()}catch(e){}}
async function pingDB(){try{const r=await fetch("api/ping",{cache:"no-store"});DBOK=r.ok}catch(e){DBOK=false}const e=$("dbSt");if(e){e.textContent=DBOK?"שרת מקומי: מחובר – השמירה נכתבת לקובץ database.json":"שרת מקומי: לא מחובר – השמירה בדפדפן הזה בלבד";e.style.color=DBOK?"#a9e4c0":"#f2c94c"}return DBOK}
async function pushDB(N){if(!await pingDB())return;let pin=sessionStorage.getItem("syn_pin")||prompt("קוד גישה לשמירה בשרת המקומי:");if(!pin)return;
  try{const r=await fetch("api/save",{method:"POST",headers:{"X-Pin":pin,"Content-Type":"application/json"},body:JSON.stringify(N)});
    if(r.ok){sessionStorage.setItem("syn_pin",pin);alert("נשמר בשרת המקומי")}else{sessionStorage.removeItem("syn_pin");alert(r.status===403?"קוד גישה שגוי":"השמירה נכשלה ("+r.status+")")}}catch(e){alert("השמירה נכשלה")}}
let lastDay=0;
let idx=0,timer;
function build(){
  lastDay=israelToday();AI=shabbatInfo();const PA=D.parsha.trim()||AI.parsha,HA=D.haf.trim()||AI.haf,CA=D.can.trim()||AI.can,VA=D.hav.trim()||AI.hav;AI.can=CA;AI.hav=VA;
  document.title=D.syn;
  const S=[];
  S.push([`<div class="digits"><div class="hexrow"><div class="hex"><div id="hh"></div></div><div class="hex"><div id="mm"></div></div><div class="hex"><div id="ss"></div></div></div><div class="scroll">בית הכנסת ״${esc(D.syn)}״<small id="bigdate"></small></div></div>`,"sky","clock"]);
  S.push([`<div class="pg"><div class="side"><div class="ribbon">הדלקת נרות</div><div class="zt">${esc(CA)}</div>${lamp}</div><div class="pan"><div class="pill">מעניני פרשת שבוע</div><div class="big">${esc(PA.replace(/^פרשת\s*/,""))}</div>${AI.sp&&!D.parsha.trim()?`<div class="pill">${esc(AI.sp)}</div>`:""}${HA?`<div class="pill">הפטרה</div><div class="hf">${esc(HA)}</div>`:""}</div><div class="side"><div class="ribbon">יציאת שבת</div><div class="zt">${esc(VA)}</div>${lamp}</div></div>`,"sky"]);
  S.push(pg("זמני תפילות","ימות החול",rows(D.prayers)));
  S.push(pg("שבת קודש","זמני שבת",rows(fillT(D.shabbat))));
  if(D.mem.trim())S.push(pg("לזכרון עולם","בהיכל ה׳",lines(D.mem).map(a=>`<div class="mem">${esc(a[0]+(a[1]?" | "+a[1]:""))}</div>`).join("")));
  if(D.haz.trim())S.push(pg("הזכרות","יזכור",ncards(D.haz)));
  {const NL=nifList();if(NL.length||D.nempty==="show")alc(NL).forEach(x=>S.push(x))}
  if(D.don.trim())S.push(pg("תודה","לתורמים",dcards(D.don)+`<div class="nc"><small>תודה על תמיכתכם בבית הכנסת</small></div>`));
  $("stage").innerHTML=S.map(s=>`<section class="slide ${s[1]}" data-k="${s[2]||""}">${s[0]}</section>`).join("");
  $("fSyn").textContent=`בית הכנסת ״${D.syn}״`;$("fDed").textContent=D.ded;$("fDed").style.display=D.ded?"":"none";
  idx=Math.min(idx,S.length-1);show(idx);tick();
}
function show(i){
  const sl=document.querySelectorAll(".slide");
  idx=(i+sl.length)%sl.length;
  sl.forEach((s,k)=>s.classList.toggle("on",k===idx));
  tick();
}
function auto(){clearInterval(timer);timer=setInterval(()=>show(idx+1),Math.max(4,+D.sec||12)*1000)}
function step(d){show(idx+d);auto()}
const pad=n=>String(n).padStart(2,"0");
function tick(){
  const n=new Date(),sl=document.querySelectorAll(".slide"),clk=sl[idx]&&sl[idx].dataset.k==="clock";
  $("med").innerHTML=clk?`<span style="font-size:calc(15*var(--u));color:#ffe08a">✡</span>`:pad(n.getHours())+":"+pad(n.getMinutes());
  $("dayN").textContent=["ראשון","שני","שלישי","רביעי","חמישי","שישי","שבת"][n.getDay()];
  const td=israelToday();if(lastDay&&td!==lastDay){build();return}
  const H=hebD(td),hd=gem(H.d)+" "+H.m,hf=hd+" ה"+gem(H.y%1000);
  $("heD").textContent=hd;
  const h=$("hh");if(h){h.textContent=pad(n.getHours());$("mm").textContent=pad(n.getMinutes());$("ss").textContent=pad(n.getSeconds());
    $("bigdate").textContent=hf+" · "+n.toLocaleDateString("he-IL",{day:"numeric",month:"long",year:"numeric"})}
}
setInterval(tick,1000);
function net(){const on=navigator.onLine;$("net").classList.toggle("off",!on);$("netTxt").textContent=on?"פועל · עובד גם ללא אינטרנט":"מצב לא מקוון · המסך ממשיך לעבוד"}
addEventListener("online",net);addEventListener("offline",net);net();
const F={syn:"f_syn",ded:"f_ded",parsha:"f_parsha",haf:"f_haf",can:"f_can",hav:"f_hav",minhag:"f_minhag",cm:"f_cm",hm:"f_hm",sec:"f_sec",prayers:"f_prayers",shabbat:"f_shabbat",mem:"f_mem",haz:"f_haz",nif:"f_nif",nmode:"f_nmode",nempty:"f_nempty",sheet:"f_sheet",smin:"f_smin",don:"f_don"};
function openAdmin(){for(const k in F)$(F[k]).value=D[k];$("admin").classList.add("on")}
$("bAd").onclick=()=>{openAdmin();stat();pingDB()};
$("bExp").onclick=()=>{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(D,null,1)],{type:"application/json"}));a.download="database.json";a.click()};
$("f_imp").onchange=e=>{const f=e.target.files[0];if(!f)return;const rd=new FileReader();rd.onload=()=>{try{Object.assign(D,JSON.parse(rd.result));openAdmin();alert("הנתונים נטענו. לחצו על שמירה.")}catch(x){alert("הקובץ אינו תקין")}};rd.readAsText(f,"utf-8")};
$("bSync").onclick=()=>{const v=$("f_sheet").value;D.sheet=v;D.smin=+$("f_smin").value||10;$("sheetSt").textContent="בודק…";SS.err="";syncSheet()};
$("bClose").onclick=()=>$("admin").classList.remove("on");
$("bSave").onclick=()=>{const N={};for(const k in F)N[k]=$(F[k]).value;N.sec=+N.sec||12;N.auto2=1;N.nifv=NIFV;D=N;
  try{localStorage.setItem("syn_data",JSON.stringify(D))}catch(e){}
  $("admin").classList.remove("on");build();auto();startSync();pushDB(N)};
$("f_csv").onchange=e=>{const f=e.target.files[0];if(!f)return;const rd=new FileReader();rd.onload=()=>{
  let tx;try{tx=new TextDecoder("utf-8",{fatal:true}).decode(rd.result)}catch(_){tx=new TextDecoder("windows-1255").decode(rd.result)}
  const rows=tx.replace(/^\uFEFF/,"").split(/\r?\n/).map(l=>l.split(/\t|;|,(?=(?:[^"]*"[^"]*")*[^"]*$)/).map(x=>x.replace(/^"|"$/g,"").trim())).filter(r=>r.some(Boolean));
  if(rows.length&&/^שם/.test(rows[0][0]))rows.shift();
  const out=rows.map(r=>r[0]+(r[1]?" / "+r[1]:"")+" | "+(r[2]||"")+(/^(כן|1|\*|קבוע|true)/i.test(r[3]||"")?" | *":""));
  $("f_nif").value=out.join("\n");alert("יובאו "+out.length+" רשומות. לחצו על שמירה.")};rd.readAsArrayBuffer(f)};
$("bNext").onclick=()=>step(1);$("bPrev").onclick=()=>step(-1);
$("bFs").onclick=()=>{try{document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen()}catch(e){}};
document.addEventListener("keydown",e=>{
  if(e.target.matches("input,textarea"))return;
  if(e.key==="ArrowLeft")step(1);else if(e.key==="ArrowRight")step(-1);
  else if(e.key==="f"||e.key==="F")$("bFs").onclick();
  else if(e.key==="e"||e.key==="E")openAdmin();
});
build();auto();startSync();pollDB();setInterval(pollDB,6e4);
if(/[?&]admin=1/.test(location.search)){openAdmin();stat();pingDB()}
if("serviceWorker"in navigator&&/^https?:/.test(location.protocol))navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
